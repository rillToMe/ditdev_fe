# nginx server block for the ditdev_fe SPA.
#
# WHY THIS FILE EXISTS
# Lighthouse reported "Use efficient cache lifetimes - Est savings of 1,569 KiB".
# The origin (nginx) sends no Cache-Control at all, so Cloudflare falls back to
# its default Browser Cache TTL of 4 hours (max-age=14400) for everything —
# including content-hashed assets that can never change under the same URL.
# The rules below are the fix. public/_headers holds the equivalent for
# Pages/Netlify; keep the two in sync.
#
# Adjust `root` and `server_name`, then include this in your main nginx conf.

server {
    listen 80;
    server_name ditdev.kyuzenstudio.com;

    root /var/www/ditdev_fe/dist;
    index index.html;

    # ---- Compress text; woff2 is already compressed, don't re-compress it.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # ---- Content-hashed build output: cache for a year, immutable.
    # Vite fingerprints every filename, so a new build = a new URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- Self-hosted webfonts: stable names, so treat as immutable too.
    # Bump the filename if a font ever changes.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types { font/woff2 woff2; }
        try_files $uri =404;
    }

    # ---- Root-level media: cache a day, revalidate in the background.
    location ~* \.(png|jpe?g|gif|svg|ico|webp|avif|pdf)$ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        try_files $uri =404;
    }

    # ---- HTML shell + crawler files: never cache.
    # index.html points at the hashed bundles, so a stale copy would pin
    # visitors to old JS. This is what makes deploys take effect instantly.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
    location = / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files /index.html =404;
    }
    location = /robots.txt {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files /robots.txt =404;
    }
    location = /_headers {
        deny all;   # build artifact for other hosts; not a public asset
    }

    # ---- SPA fallback: unknown paths render the app (client-side router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- The API is served by the Rust backend, not this static root.
    location /api/ {
        proxy_pass http://127.0.0.1:2817;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
